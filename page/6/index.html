<ul>
<li><strong>数据清洗与划分</strong><ul>
<li>基础清洗操作：去重、缺失值、异常值</li>
<li>算法驱动的智能清洗（高级）</li>
<li>数据质量校验与管道集成（高级）</li>
<li>清洗 API 的层级对照</li>
<li>先看决策逻辑：你的数据该用什么划分</li>
<li>基础随机划分</li>
<li>分层划分：分类任务的基本约束</li>
<li>分组划分：防止实体级泄漏</li>
<li>交叉验证</li>
<li>时间序列划分</li>
<li>分布偏移感知的划分（高级）</li>
<li>高级集成：把划分逻辑收进管道</li>
<li>划分策略速查与关键陷阱</li>
</ul>
</li>
<li><strong>加载与预处理</strong><ul>
<li>数据加载容器：<code>Dataset</code> 与 <code>DataLoader</code></li>
<li>采样与批次整理</li>
<li>图像与视频：<code>torchvision.transforms.v2</code></li>
<li>变换能力的增强</li>
<li>文本：从 <code>torchtext</code> 迁移</li>
<li>音频：<code>torchaudio</code></li>
<li>预处理流水线的位置</li>
<li>管道的组织与复用</li>
<li>加载性能与规模</li>
<li>高级数据 API 的定位对照</li>
</ul>
</li>
<li><strong>特征工程</strong><ul>
<li>数值特征：缩放、变换、分箱、交互</li>
<li>类别特征：编码策略的选择取决于基数</li>
<li>日期时间特征</li>
<li>特征选择：先构造，再筛选</li>
<li>文本特征：从 TF-IDF 到上下文嵌入</li>
<li>图像特征：手工算子与 CNN 嵌入</li>
<li>时间序列特征：统计描述子与大规模自动提取</li>
<li>聚合与滞后特征：业务场景中信息量最高的手工特征</li>
<li>自动化特征工程（高级）</li>
<li>深度学习时代的表格特征：让模型学习交叉，而非手工枚举</li>
<li>特征工程 API 的层级对照与关键原则</li>
</ul>
</li>
<li><strong>模型构建</strong><ul>
<li>模型容器</li>
<li>基础层</li>
<li>激活函数</li>
<li>权重初始化</li>
<li>模型选择：先定约束，再定基线</li>
</ul>
</li>
<li><strong>训练</strong><ul>
<li>训练循环骨架：五步是不变的核心</li>
<li>损失函数</li>
<li>优化器：起点决定收敛路径</li>
<li>学习率调度：训练中最具杠杆的超参数</li>
<li>正则化与稳定训练：防止过拟合与训练崩溃</li>
<li>精度与显存</li>
<li>分布式训练</li>
<li>编译加速</li>
<li>训练流程控制</li>
<li>超参数搜索</li>
<li>训练配置模板与避坑清单</li>
<li>高级 API 与底层 API 的映射</li>
</ul>
</li>
<li><strong>评估</strong><ul>
<li>基础任务指标：选对指标比调高指标更重要</li>
<li>高级评估维度：指标之外的可信度</li>
<li>统计比较：两个模型的差距是真实的吗</li>
<li>持续评估：模型上线后，评估没有结束</li>
<li>评估协议与避坑清单</li>

<li><strong>可视化</strong><ul>
