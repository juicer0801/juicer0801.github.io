="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br></pre></td><td class="code"><pre><code class="hljs c"><span class="hljs-comment">// 字符串反转</span><br><span class="hljs-type">void</span> <span class="hljs-title function_">reverse</span><span class="hljs-params">(<span class="hljs-type">char</span> *s)</span> &#123;<br>    <span class="hljs-type">char</span> *p = s, *q = s + <span class="hljs-built_in">strlen</span>(s) - <span class="hljs-number">1</span>;<br>    <span class="hljs-keyword">while</span> (p &lt; q) &#123;<br>        <span class="hljs-type">char</span> t = *p; *p++ = *q; *q-- = t;<br>    &#125;<br>&#125;<br><br><br><span class="hljs-comment">// 链表反转</span><br>ListNode *<span class="hljs-title function_">reverse</span><span class="hljs-params">(ListNode *head)</span> &#123;<br>    ListNode *prev = <span class="hljs-literal">NULL</span>;<br>    <span class="hljs-keyword">while</span> (head) &#123;<br>        ListNode *next = head-&gt;next;<br>        head-&gt;next = prev;<br>        prev = head;<br>        head = next;<br>    &#125;<br>    <span class="hljs-keyword">return</span> prev;<br>&#125;<br><br><span class="hljs-comment">// 快慢指针判断链表有环</span><br><span class="hljs-type">int</span> <span class="hljs-title function_">hasCycle</span><span class="hljs-params">(ListNode *head)</span> &#123;<br>    ListNode *slow = head, *fast = head;<br>    <span class="hljs-keyword">while</span> (fast &amp;&amp; fast-&gt;next) &#123;<br>        slow = slow-&gt;next;<br>        fast = fast-&gt;next-&gt;next;<br>        <span class="hljs-keyword">if</span> (slow == fast) <span class="hljs-keyword">return</span> <span class="hljs-number">1</span>;<br>    &#125;<br>    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;<br>&#125;<br><br><span class="hljs-comment">// 实现 strcpy</span><br><span class="hljs-type">char</span> *<span class="hljs-title function_">my_strcpy</span><span class="hljs-params">(<span class="hljs-type">char</span> *dst, <span class="hljs-type">const</span> <span class="hljs-type">char</span> *src)</span> &#123;<br>    <span class="hljs-type">char</span> *ret = dst;<br>    <span class="hljs-keyword">while</span> ((*dst++ = *src++)) &#123; &#125;<br>    <span class="hljs-keyword">return</span> ret;<br>&#125;<br><br><span class="hljs-comment">// 二分查找</span><br><span class="hljs-type">int</span> <span class="hljs-title function_">binary_search</span><span class="hljs-params">(<span class="hljs-type">int</span> a[], <span class="hljs-type">int</span> n, <span class="hljs-type">int</span> target)</span> &#123;<br>    <span class="hljs-type">int</span> l = <span class="hljs-number">0</span>, r = n - <span class="hljs-number">1</span>;<br>    <span class="hljs-keyword">while</span> (l &lt;= r) &#123;<br>        <span class="hljs-type">int</span> mid = l + (r - l) / <span class="hljs-number">2</span>;   <span class="hljs-comment">// 防溢出</span><br>        <span class="hljs-keyword">if</span> (a[mid] == target) <span class="hljs-keyword">return</span> mid;<br>        <span class="hljs-keyword">if</span> (a[mid] &lt; target) l = mid + <span class="hljs-number">1</span>;<br>        <span class="hljs-keyword">else</span> r = mid - <span class="hljs-number">1</span>;<br>    &#125;<br>    <span class="hljs-keyword">return</span> <span class="hljs-number">-1</span>;<br>&#125;<br><br><span class="hljs-comment">// 实现 atoi</span><br><span class="hljs-type">int</span> <span class="hljs-title function_">my_atoi</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">char</span> *s)</span> &#123;<br>    <span class="hljs-type">int</span> sign = <span class="hljs-number">1</span>, num = <span class="hljs-number">0</span>;<br>    <span class="hljs-keyword">while</span> (*s == <span class="hljs-string">&#x27; &#x27;</span>) s++;<br>    <span class="hljs-keyword">if</span> (*s == <span class="hljs-string">&#x27;-&#x27;</span>) &#123; sign = <span class="hljs-number">-1</span>; s++; &#125;<br>    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (*s == <span class="hljs-string">&#x27;+&#x27;</span>) s++;<br>    <span class="hljs-keyword">while</span> (*s &gt;= <span class="hljs-string">&#x27;0&#x27;</span> &amp;&amp; *s &lt;= <span class="hljs-string">&#x27;9&#x27;</span>) &#123;<br>        num = num * <span class="hljs-number">10</span> + (*s - <span class="hljs-string">&#x27;0&#x27;</span>);<br>        s++;<br>    &#125;<br>    <span class="hljs-keyword">return</span> sign * num;<br>&#125;<br><br></code></pre></td></tr></table></figure></p>
