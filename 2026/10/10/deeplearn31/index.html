/span><br><span class="line">262</span><br><span class="line">263</span><br><span class="line">264</span><br><span class="line">265</span><br><span class="line">266</span><br><span class="line">267</span><br><span class="line">268</span><br><span class="line">269</span><br><span class="line">270</span><br><span class="line">271</span><br><span class="line">272</span><br><span class="line">273</span><br><span class="line">274</span><br><span class="line">275</span><br><span class="line">276</span><br><span class="line">277</span><br><span class="line">278</span><br><span class="line">279</span><br><span class="line">280</span><br><span class="line">281</span><br><span class="line">282</span><br><span class="line">283</span><br><span class="line">284</span><br><span class="line">285</span><br><span class="line">286</span><br><span class="line">287</span><br><span class="line">288</span><br><span class="line">289</span><br><span class="line">290</span><br><span class="line">291</span><br><span class="line">292</span><br><span class="line">293</span><br><span class="line">294</span><br><span class="line">295</span><br><span class="line">296</span><br><span class="line">297</span><br><span class="line">298</span><br><span class="line">299</span><br><span class="line">300</span><br><span class="line">301</span><br><span class="line">302</span><br><span class="line">303</span><br><span class="line">304</span><br><span class="line">305</span><br><span class="line">306</span><br><span class="line">307</span><br><span class="line">308</span><br><span class="line">309</span><br><span class="line">310</span><br><span class="line">311</span><br><span class="line">312</span><br><span class="line">313</span><br><span class="line">314</span><br><span class="line">315</span><br><span class="line">316</span><br></pre></td><td class="code"><pre><code class="hljs python"><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 中文情感分类 (好评/差评) —— 教学版</span><br><span class="hljs-comment"># 数据集: ChnSentiCorp (酒店评论)</span><br><span class="hljs-comment"># 模型:   Embedding → RNN → Linear</span><br><span class="hljs-comment"># 作者提示: 从上到下顺序阅读, 每一段都有&quot;为什么&quot;的注释</span><br><span class="hljs-comment"># ============================================================</span><br><br><span class="hljs-comment"># ---------- 0. 导入依赖 ----------</span><br><span class="hljs-keyword">import</span> time                                              <span class="hljs-comment"># 计时, 看每个 epoch 多快</span><br><span class="hljs-keyword">import</span> torch                                             <span class="hljs-comment"># PyTorch 主库</span><br><span class="hljs-keyword">import</span> torch.nn <span class="hljs-keyword">as</span> nn                                    <span class="hljs-comment"># 网络层 / 损失函数</span><br><span class="hljs-keyword">import</span> torch.optim <span class="hljs-keyword">as</span> optim                              <span class="hljs-comment"># 优化器</span><br><span class="hljs-keyword">from</span> torch.utils.data <span class="hljs-keyword">import</span> Dataset, DataLoader         <span class="hljs-comment"># 数据集抽象 + 批量加载</span><br><span class="hljs-keyword">from</span> datasets <span class="hljs-keyword">import</span> load_dataset                        <span class="hljs-comment"># HuggingFace 数据集库</span><br><span class="hljs-keyword">import</span> jieba                                             <span class="hljs-comment"># 中文分词</span><br><span class="hljs-keyword">from</span> collections <span class="hljs-keyword">import</span> Counter                          <span class="hljs-comment"># 词频统计</span><br><span class="hljs-keyword">from</span> sklearn.metrics <span class="hljs-keyword">import</span> accuracy_score, f1_score, confusion_matrix  <span class="hljs-comment"># 评估指标</span><br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 1. 全局配置: 所有超参数集中放这里, 方便调参</span><br><span class="hljs-comment"># ============================================================</span><br>DEVICE      = torch.device(<span class="hljs-string">&#x27;cuda&#x27;</span> <span class="hljs-keyword">if</span> torch.cuda.is_available() <span class="hljs-keyword">else</span> <span class="hljs-string">&#x27;cpu&#x27;</span>)<br>MAX_LEN     = <span class="hljs-number">100</span>      <span class="hljs-comment"># 一条评论最多保留 100 个词, 超了截断, 短了补齐</span><br>BATCH_SIZE  = <span class="hljs-number">32</span>       <span class="hljs-comment"># 每批 32 条样本</span><br>EMBED_DIM   = <span class="hljs-number">128</span>      <span class="hljs-comment"># 每个词映射成 128 维向量</span><br>HIDDEN_SIZE = <span class="hljs-number">256</span>      <span class="hljs-comment"># RNN 隐藏状态 256 维</span><br>NUM_LAYERS  = <span class="hljs-number">1</span>        <span class="hljs-comment"># RNN 只堆 1 层 (多了容易过拟合 + 慢)</span><br>EPOCHS      = <span class="hljs-number">10</span>       <span class="hljs-comment"># 训练 10 轮</span><br>LR          = <span class="hljs-number">1e-3</span>     <span class="hljs-comment"># 学习率 0.001</span><br>MIN_FREQ    = <span class="hljs-number">2</span>        <span class="hljs-comment"># 词频 &lt;2 的一律当 &lt;unk&gt;, 过滤噪声</span><br>MAX_VOCAB   = <span class="hljs-number">20000</span>    <span class="hljs-comment"># 词表最多 20000 个词, 防止太大</span><br><br><span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Using device: <span class="hljs-subst">&#123;DEVICE&#125;</span>&quot;</span>)   <span class="hljs-comment"># 打印用的 GPU 还是 CPU</span><br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 2. 加载数据集</span><br><span class="hljs-comment">#    ChnSentiCorp 结构:</span><br><span class="hljs-comment">#      train      : 训练集 (约 9600 条)</span><br><span class="hljs-comment">#      validation : 验证集 (约 1200 条)</span><br><span class="hljs-comment">#      test       : 测试集 (约 1200 条)</span><br><span class="hljs-comment">#    每条样本是 &#123;&#x27;text&#x27;: &#x27;...&#x27;, &#x27;label&#x27;: 1 或 0&#125;  1=好评 0=差评</span><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Loading ChnSentiCorp ...&quot;</span>)<br>dataset = load_dataset(<br>    path=<span class="hljs-string">&quot;lansinuote/ChnSentiCorp&quot;</span>,   <span class="hljs-comment"># 数据集名字, 会自动下载</span><br>    cache_dir=<span class="hljs-string">&quot;./data&quot;</span>,               <span class="hljs-comment"># 下载后缓存在本地 ./data 目录</span><br>    trust_remote_code=<span class="hljs-literal">True</span>            <span class="hljs-comment"># 允许执行数据集自带的加载脚本</span><br>)<br><span class="hljs-built_in">print</span>(dataset)                         <span class="hljs-comment"># 打印数据集结构, 方便检查</span><br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 3. 构建词表</span><br><span class="hljs-comment">#    核心思想: 把&quot;词&quot;变成&quot;整数 ID&quot;, 模型只认数字</span><br><span class="hljs-comment">#    流程: 分词 → 统计词频 → 按频率从高到低编号</span><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">build_vocab</span>(<span class="hljs-params">texts, min_freq=<span class="hljs-number">2</span>, max_size=<span class="hljs-number">20000</span></span>):<br>    <span class="hljs-string">&quot;&quot;&quot;</span><br><span class="hljs-string">    texts    : 训练集所有文本 (只用训练集! 用别的会数据泄露)</span><br><span class="hljs-string">    min_freq : 词频低于该值就不收录, 直接当 &lt;unk&gt;</span><br><span class="hljs-string">    max_size : 词表上限, 防止词表爆炸</span><br><span class="hljs-string">    返回     : &#123;词: ID&#125;</span><br><span class="hljs-string">    &quot;&quot;&quot;</span><br>    counter = Counter()                    <span class="hljs-comment"># 空计数器</span><br>    <span class="hljs-keyword">for</span> text <span class="hljs-keyword">in</span> texts:                     <span class="hljs-comment"># 遍历每条评论</span><br>        words = jieba.lcut(text)           <span class="hljs-comment"># jieba 分词, lcut 返回 list</span><br>        counter.update(words)              <span class="hljs-comment"># 把这一句的词加到计数器里</span><br><br>    <span class="hljs-comment"># 两个特殊符号: &lt;pad&gt; 补齐, &lt;unk&gt; 未知词</span><br>    word_to_index = &#123;<span class="hljs-string">&#x27;&lt;pad&gt;&#x27;</span>: <span class="hljs-number">0</span>, <span class="hljs-string">&#x27;&lt;unk&gt;&#x27;</span>: <span class="hljs-number">1</span>&#125;<br><br>    <span class="hljs-comment"># most_common(): 按词频从高到低遍历 (词, 次数)</span><br>    <span class="hljs-keyword">for</span> word, freq <span class="hljs-keyword">in</span> counter.most_common():<br>        <span class="hljs-keyword">if</span> freq &lt; min_freq:                <span class="hljs-comment"># 频率不达标</span><br>            <span class="hljs-keyword">break</span>                          <span class="hljs-comment"># 因为已经排好序, 后面只会更低 → 直接 break</span><br>        <span class="hljs-keyword">if</span> <span class="hljs-built_in">len</span>(word_to_index) &gt;= max_size: <span class="hljs-comment"># 词表满了</span><br>            <span class="hljs-keyword">break</span><br>        <span class="hljs-keyword">if</span> word <span class="hljs-keyword">not</span> <span class="hljs-keyword">in</span> word_to_index:      <span class="hljs-comment"># 还没收录过</span><br>            word_to_index[word] = <span class="hljs-built_in">len</span>(word_to_index)  <span class="hljs-comment"># ID = 当前词表长度</span><br><br>    <span class="hljs-keyword">return</span> word_to_index<br><br><br>train_texts = dataset[<span class="hljs-string">&#x27;train&#x27;</span>][<span class="hljs-string">&#x27;text&#x27;</span>]                             <span class="hljs-comment"># 只取训练集文本</span><br>word_to_index = build_vocab(train_texts, MIN_FREQ, MAX_VOCAB)      <span class="hljs-comment"># 建词表</span><br>vocab_size = <span class="hljs-built_in">len</span>(word_to_index)                                    <span class="hljs-comment"># 词表大小</span><br><span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Vocabulary size: <span class="hljs-subst">&#123;vocab_size&#125;</span>&quot;</span>)<br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 4. 自定义 Dataset</span><br><span class="hljs-comment">#    PyTorch 要求实现 __len__ 和 __getitem__ 两个方法</span><br><span class="hljs-comment">#    作用: 把 (文本, 标签) 转成 (ID张量, 标签张量, 长度)</span><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-keyword">class</span> <span class="hljs-title class_">SentimentDataset</span>(<span class="hljs-title class_ inherited__">Dataset</span>):<br>    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, texts, labels, word_to_index, max_len</span>):<br>        <span class="hljs-variable language_">self</span>.texts = texts                             <span class="hljs-comment"># 原始文本列表</span><br>        <span class="hljs-variable language_">self</span>.labels = labels                           <span class="hljs-comment"># 原始标签列表</span><br>        <span class="hljs-variable language_">self</span>.word_to_index = word_to_index             <span class="hljs-comment"># 词表</span><br>        <span class="hljs-variable language_">self</span>.max_len = max_len                         <span class="hljs-comment"># 最大长度</span><br>        <span class="hljs-variable language_">self</span>.pad_idx = word_to_index[<span class="hljs-string">&#x27;&lt;pad&gt;&#x27;</span>]          <span class="hljs-comment"># 0</span><br>        <span class="hljs-variable language_">self</span>.unk_idx = word_to_index[<span class="hljs-string">&#x27;&lt;unk&gt;&#x27;</span>]          <span class="hljs-comment"># 1</span><br><br>    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__len__</span>(<span class="hljs-params">self</span>):<br>        <span class="hljs-comment"># DataLoader 需要知道总共有多少条样本</span><br>        <span class="hljs-keyword">return</span> <span class="hljs-built_in">len</span>(<span class="hljs-variable language_">self</span>.texts)<br><br>    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__getitem__</span>(<span class="hljs-params">self, idx</span>):<br>        <span class="hljs-comment"># ---- 4.1 取一条样本 ----</span><br>        text = <span class="hljs-variable language_">self</span>.texts[idx]<br>        label = <span class="hljs-variable language_">self</span>.labels[idx]<br><br>        <span class="hljs-comment"># ---- 4.2 分词 → 转 ID (没见过的词用 &lt;unk&gt;) ----</span><br>        words = jieba.lcut(text)<br>        ids = [<span class="hljs-variable language_">self</span>.word_to_index.get(w, <span class="hljs-variable language_">self</span>.unk_idx) <span class="hljs-keyword">for</span> w <span class="hljs-keyword">in</span> words]<br><br>        <span class="hljs-comment"># ---- 4.3 截断 (太长会浪费算力) ----</span><br>        ids = ids[:<span class="hljs-variable language_">self</span>.max_len]<br><br>        <span class="hljs-comment"># ---- 4.4 记录真实长度 (至少为 1, 防止空句子) ----</span><br>        <span class="hljs-comment"># 后面 RNN 取&quot;最后一个有效时间步&quot;要用它</span><br>        length = <span class="hljs-built_in">max</span>(<span class="hljs-built_in">len</span>(ids), <span class="hljs-number">1</span>)<br><br>        <span class="hljs-comment"># ---- 4.5 补齐 (太短要 pad 到 max_len, 才能凑成矩阵) ----</span><br>        ids = ids + [<span class="hljs-variable language_">self</span>.pad_idx] * (<span class="hljs-variable language_">self</span>.max_len - <span class="hljs-built_in">len</span>(ids))<br><br>        <span class="hljs-keyword">return</span> (<br>            torch.tensor(ids, dtype=torch.long),       <span class="hljs-comment"># 输入 ID</span><br>            torch.tensor(label, dtype=torch.long),     <span class="hljs-comment"># 标签</span><br>            torch.tensor(length, dtype=torch.long),    <span class="hljs-comment"># 真实长度</span><br>        )<br><br><br><span class="hljs-comment"># 构造三个 Dataset</span><br>train_dataset = SentimentDataset(dataset[<span class="hljs-string">&#x27;train&#x27;</span>][<span class="hljs-string">&#x27;text&#x27;</span>],      dataset[<span class="hljs-string">&#x27;train&#x27;</span>][<span class="hljs-string">&#x27;label&#x27;</span>],      word_to_index, MAX_LEN)<br>val_dataset   = SentimentDataset(dataset[<span class="hljs-string">&#x27;validation&#x27;</span>][<span class="hljs-string">&#x27;text&#x27;</span>], dataset[<span class="hljs-string">&#x27;validation&#x27;</span>][<span class="hljs-string">&#x27;label&#x27;</span>], word_to_index, MAX_LEN)<br>test_dataset  = SentimentDataset(dataset[<span class="hljs-string">&#x27;test&#x27;</span>][<span class="hljs-string">&#x27;text&#x27;</span>],       dataset[<span class="hljs-string">&#x27;test&#x27;</span>][<span class="hljs-string">&#x27;label&#x27;</span>],       word_to_index, MAX_LEN)<br><br><span class="hljs-comment"># 用 DataLoader 包起来: 自动批量 + 打乱 + 多进程 (这里单进程)</span><br>train_loader = DataLoader(train_dataset, batch_size=BATCH_SIZE, shuffle=<span class="hljs-literal">True</span>)   <span class="hljs-comment"># 训练集打乱</span><br>val_loader   = DataLoader(val_dataset,   batch_size=BATCH_SIZE, shuffle=<span class="hljs-literal">False</span>)  <span class="hljs-comment"># 验证集不打乱</span><br>test_loader  = DataLoader(test_dataset,  batch_size=BATCH_SIZE, shuffle=<span class="hljs-literal">False</span>)  <span class="hljs-comment"># 测试集不打乱</span><br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 5. 模型定义</span><br><span class="hljs-comment">#    数据流:  (B, L) → Embedding → (B, L, E) → RNN → (B, L, H) → 取最后有效步 → (B, H) → Linear → (B, 2)</span><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-keyword">class</span> <span class="hljs-title class_">SentimentRNN</span>(nn.Module):<br>    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, vocab_size, embed_dim, hidden_size, num_layers, num_classes=<span class="hljs-number">2</span></span>):<br>        <span class="hljs-built_in">super</span>().__init__()<br><br>        <span class="hljs-comment"># 5.1 词嵌入: 每个 ID 换成 embed_dim 维向量</span><br>        <span class="hljs-comment">#     padding_idx=0 表示 &lt;pad&gt; 的向量恒为 0, 且不参与梯度更新</span><br>        <span class="hljs-variable language_">self</span>.embedding = nn.Embedding(vocab_size, embed_dim, padding_idx=<span class="hljs-number">0</span>)<br><br>        <span class="hljs-comment"># 5.2 RNN 层</span><br>        <span class="hljs-comment">#     batch_first=True → 输入形状是 (batch, seq_len, embed_dim)</span><br>        <span class="hljs-comment">#     默认非线性激活是 tanh</span><br>        <span class="hljs-variable language_">self</span>.rnn = nn.RNN(<br>            input_size=embed_dim,<br>            hidden_size=hidden_size,<br>            num_layers=num_layers,<br>            batch_first=<span class="hljs-literal">True</span>,<br>        )<br><br>        <span class="hljs-comment"># 5.3 全连接: 把 hidden_size 维特征映射成 2 类得分</span><br>        <span class="hljs-variable language_">self</span>.fc = nn.Linear(hidden_size, num_classes)<br><br>    <span class="hljs-keyword">def</span> <span class="hljs-title function_">forward</span>(<span class="hljs-params">self, x, lengths</span>):<br>        <span class="hljs-comment"># x: (batch, seq_len) 的整数张量</span><br>        emb = <span class="hljs-variable language_">self</span>.embedding(x)                 <span class="hljs-comment"># (B, L)    → (B, L, E)</span><br><br>        <span class="hljs-comment"># RNN 前向</span><br>        <span class="hljs-comment"># output: (B, L, H)  每个时间步的隐状态</span><br>        <span class="hljs-comment"># hidden: (num_layers, B, H)  最后一个时间步的隐状态</span><br>        output, hidden = <span class="hljs-variable language_">self</span>.rnn(emb)<br><br>        <span class="hljs-comment"># 5.4 关键技巧: 取&quot;最后一个有效时间步&quot;的 output</span><br>        <span class="hljs-comment">#     为什么不用 hidden[-1]? 因为 padding 会污染 hidden</span><br>        <span class="hljs-comment">#     (RNN 会把 &lt;pad&gt; 也读进去), 所以要精确定位每条样本的真实末尾</span><br>        batch_size = x.size(<span class="hljs-number">0</span>)<br>        idx = (lengths - <span class="hljs-number">1</span>).to(x.device)        <span class="hljs-comment"># 真实末尾的下标 (B,)</span><br>        last_output = output[<br>            torch.arange(batch_size, device=x.device),   <span class="hljs-comment"># 行索引: 0..B-1</span><br>            idx                                          <span class="hljs-comment"># 列索引: 每条的真实末尾</span><br>        ]                                        <span class="hljs-comment"># (B, H)</span><br><br>        <span class="hljs-comment"># 5.5 过全连接得到 2 类 logits (未经过 softmax)</span><br>        logits = <span class="hljs-variable language_">self</span>.fc(last_output)            <span class="hljs-comment"># (B, 2)</span><br>        <span class="hljs-keyword">return</span> logits<br><br><br><span class="hljs-comment"># 实例化模型并搬到设备上</span><br>model = SentimentRNN(vocab_size, EMBED_DIM, HIDDEN_SIZE, NUM_LAYERS).to(DEVICE)<br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 6. 损失函数 &amp; 优化器</span><br><span class="hljs-comment"># ============================================================</span><br>criterion = nn.CrossEntropyLoss()                       <span class="hljs-comment"># 内部自带 softmax, 输入是 logits</span><br>optimizer = optim.Adam(model.parameters(), lr=LR)       <span class="hljs-comment"># Adam 优化器, 自适应学习率</span><br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 7. 评估函数 (训练中 &amp; 测试时都会用)</span><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">evaluate</span>(<span class="hljs-params">model, loader</span>):<br>    <span class="hljs-string">&quot;&quot;&quot;返回: 平均 loss, 准确率, F1, 所有预测, 所有真实标签&quot;&quot;&quot;</span><br>    model.<span class="hljs-built_in">eval</span>()                                <span class="hljs-comment"># 切评估模式: 关闭 Dropout/BN</span><br>    total_loss = <span class="hljs-number">0.0</span><br>    all_preds, all_labels = [], []              <span class="hljs-comment"># 收集所有预测 / 标签, 最后算指标</span><br><br>    <span class="hljs-keyword">with</span> torch.no_grad():                       <span class="hljs-comment"># 关闭梯度: 省显存 + 提速</span><br>        <span class="hljs-keyword">for</span> x, y, lengths <span class="hljs-keyword">in</span> loader:            <span class="hljs-comment"># 逐批取</span><br>            x, y = x.to(DEVICE), y.to(DEVICE)   <span class="hljs-comment"># 搬到设备</span><br>            logits = model(x, lengths)          <span class="hljs-comment"># 前向</span><br>            loss = criterion(logits, y)         <span class="hljs-comment"># 算损失</span><br>            total_loss += loss.item()           <span class="hljs-comment"># 累加</span><br><br>            preds = torch.argmax(logits, dim=<span class="hljs-number">1</span>) <span class="hljs-comment"># 取分高的类别</span><br>            all_preds.extend(preds.cpu().numpy())   <span class="hljs-comment"># 搬到 CPU 再转 numpy</span><br>            all_labels.extend(y.cpu().numpy())<br><br>    avg_loss = total_loss / <span class="hljs-built_in">len</span>(loader)         <span class="hljs-comment"># 平均损失</span><br>    acc = accuracy_score(all_labels, all_preds) <span class="hljs-comment"># 准确率</span><br>    f1  = f1_score(all_labels, all_preds)       <span class="hljs-comment"># F1 (类别不均衡时更可信)</span><br>    <span class="hljs-keyword">return</span> avg_loss, acc, f1, all_preds, all_labels<br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 8. 训练循环</span><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(EPOCHS):<br>    model.train()                              <span class="hljs-comment"># 切训练模式: 开启 Dropout</span><br>    start = time.time()                        <span class="hljs-comment"># 记录开始时间</span><br>    total_loss = <span class="hljs-number">0.0</span><br><br>    <span class="hljs-keyword">for</span> x, y, lengths <span class="hljs-keyword">in</span> train_loader:         <span class="hljs-comment"># 逐批</span><br>        x, y = x.to(DEVICE), y.to(DEVICE)      <span class="hljs-comment"># 搬设备</span><br><br>        logits = model(x, lengths)             <span class="hljs-comment"># 前向: (B, 2)</span><br>        loss = criterion(logits, y)            <span class="hljs-comment"># 算损失</span><br><br>        optimizer.zero_grad()                  <span class="hljs-comment"># 清空上一轮梯度 (必须!)</span><br>        loss.backward()                        <span class="hljs-comment"># 反向传播</span><br>        optimizer.step()                       <span class="hljs-comment"># 更新参数</span><br><br>        total_loss += loss.item()              <span class="hljs-comment"># 累加</span><br><br>    train_loss = total_loss / <span class="hljs-built_in">len</span>(train_loader)                     <span class="hljs-comment"># 平均训练损失</span><br>    val_loss, val_acc, val_f1, _, _ = evaluate(model, val_loader)   <span class="hljs-comment"># 验证</span><br><br>    <span class="hljs-comment"># 打印本轮结果</span><br>    <span class="hljs-built_in">print</span>(<br>        <span class="hljs-string">f&quot;Epoch <span class="hljs-subst">&#123;epoch + <span class="hljs-number">1</span>:&gt;<span class="hljs-number">2</span>&#125;</span>/<span class="hljs-subst">&#123;EPOCHS&#125;</span> | &quot;</span><br>        <span class="hljs-string">f&quot;time: <span class="hljs-subst">&#123;time.time() - start:<span class="hljs-number">.2</span>f&#125;</span>s | &quot;</span><br>        <span class="hljs-string">f&quot;train_loss: <span class="hljs-subst">&#123;train_loss:<span class="hljs-number">.4</span>f&#125;</span> | &quot;</span><br>        <span class="hljs-string">f&quot;val_loss: <span class="hljs-subst">&#123;val_loss:<span class="hljs-number">.4</span>f&#125;</span> | &quot;</span><br>        <span class="hljs-string">f&quot;val_acc: <span class="hljs-subst">&#123;val_acc:<span class="hljs-number">.4</span>f&#125;</span> | &quot;</span><br>        <span class="hljs-string">f&quot;val_f1: <span class="hljs-subst">&#123;val_f1:<span class="hljs-number">.4</span>f&#125;</span>&quot;</span><br>    )<br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 9. 测试集最终评估</span><br><span class="hljs-comment"># ============================================================</span><br>test_loss, test_acc, test_f1, test_preds, test_labels = evaluate(model, test_loader)<br><br><span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;\n========== Test Results ==========&quot;</span>)<br><span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Test Loss:     <span class="hljs-subst">&#123;test_loss:<span class="hljs-number">.4</span>f&#125;</span>&quot;</span>)<br><span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Test Accuracy: <span class="hljs-subst">&#123;test_acc:<span class="hljs-number">.4</span>f&#125;</span>&quot;</span>)<br><span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Test F1:       <span class="hljs-subst">&#123;test_f1:<span class="hljs-number">.4</span>f&#125;</span>&quot;</span>)<br><span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Confusion Matrix:&quot;</span>)                       <span class="hljs-comment"># 混淆矩阵: 看哪类容易错</span><br><span class="hljs-built_in">print</span>(confusion_matrix(test_labels, test_preds))  <span class="hljs-comment"># 行=真实, 列=预测</span><br><br><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-comment"># 10. 单句预测函数 (推理接口)</span><br><span class="hljs-comment"># ============================================================</span><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">predict</span>(<span class="hljs-params">text</span>):<br>    <span class="hljs-string">&quot;&quot;&quot;输入一句话, 返回 &#x27;好评&#x27; 或 &#x27;差评&#x27;&quot;&quot;&quot;</span><br>    model.<span class="hljs-built_in">eval</span>()                                    <span class="hljs-comment"># 评估模式</span><br><br>    <span class="hljs-comment"># ---- 复刻 Dataset 里的预处理, 保证训练/推理一致 ----</span><br>    words = jieba.lcut(text)                        <span class="hljs-comment"># 分词</span><br>    ids = [word_to_index.get(w, word_to_index[<span class="hljs-string">&#x27;&lt;unk&gt;&#x27;</span>]) <span class="hljs-keyword">for</span> w <span class="hljs-keyword">in</span> words]   <span class="hljs-comment"># 转 ID</span><br>    ids = ids[:MAX_LEN]                             <span class="hljs-comment"># 截断</span><br>    length = <span class="hljs-built_in">max</span>(<span class="hljs-built_in">len</span>(ids), <span class="hljs-number">1</span>)                       <span class="hljs-comment"># 真实长度</span><br>    ids = ids + [word_to_index[<span class="hljs-string">&#x27;&lt;pad&gt;&#x27;</span>]] * (MAX_LEN - <span class="hljs-built_in">len</span>(ids))          <span class="hljs-comment"># 补齐</span><br><br>    <span class="hljs-comment"># ---- 组 batch, 形状要 (1, MAX_LEN) ----</span><br>    x = torch.tensor(ids, dtype=torch.long).unsqueeze(<span class="hljs-number">0</span>).to(DEVICE)<br>    lengths = torch.tensor([length], dtype=torch.long)<br><br>    <span class="hljs-keyword">with</span> torch.no_grad():                           <span class="hljs-comment"># 推理不用梯度</span><br>        logits = model(x, lengths)                  <span class="hljs-comment"># (1, 2)</span><br>        pred = torch.argmax(logits, dim=<span class="hljs-number">1</span>).item()   <span class="hljs-comment"># 取类别</span><br><br>    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;好评&quot;</span> <span class="hljs-keyword">if</span> pred == <span class="hljs-number">1</span> <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;差评&quot;</span>          <span class="hljs-comment"># 1=好评 0=差评</span><br><br><br><span class="hljs-comment"># 测试几个句子</span><br>examples = [<br>    <span class="hljs-string">&quot;这家餐厅味道很好，服务也很周到，下次还会再来！&quot;</span>,<br>    <span class="hljs-string">&quot;菜太咸了，服务员态度也差，再也不会来了。&quot;</span>,<br>    <span class="hljs-string">&quot;东西还行吧，没什么特别的感觉。&quot;</span>,<br>    <span class="hljs-string">&quot;质量很好，物流很快，非常满意！&quot;</span>,<br>    <span class="hljs-string">&quot;包装破损了，里面的东西也坏了，差评。&quot;</span>,<br>]<br><br><span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;\n========== 预测示例 ==========&quot;</span>)<br><span class="hljs-keyword">for</span> text <span class="hljs-keyword">in</span> examples:<br>    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;  <span class="hljs-subst">&#123;text&#125;</span>  -&gt;  <span class="hljs-subst">&#123;predict(text)&#125;</span>&quot;</span>)<br></code></pre></td></tr></table></figure><div id="paginator"></div></div><div id="post-footer"><div id="pages"><div class="footer-link" style="width: 50%;text-align:right;border-right:1px #fe2 solid"><a href="/2026/10/10/deeplearn32/">← Next 情感分析器代码讲解2</a></div><div class="footer-link" style="width: 50%;right:1px;border-left:1px #fe2 solid"><a href="/2026/10/10/deeplearn30/">rnn三行代码的理解 Prev →</a></div></div></div></div><div class="bottom-btn"><div><a class="i-top" id="to-top" onClick="scrolls.scrolltop();" title="To Top" style="opacity: 0; display: none;">∧ </a><a class="i-color" id="color-mode" onClick="colorMode.change()" title="Change Theme"></a><a onclick="BgmControl()"><svg id="bgm-control" viewBox="0 0 30 34" fill="#18d1ff" style="width: 24px; transition: transform .3s;margin-top: 4px"><path d="M25.998 23.422V11.29h3.999v12.132h-3.999zM19.497 6.234h4.001v22.243h-4.001V6.234zM12.998.867h4v32.978h-4V.867zm-6.5 5.367h4.001v22.243H6.498V6.234zm-6.5 5.056h4v12.132h-4V11.29z"></path></svg><audio id="bgm" src="/audio/bgm.mp3" autoplay loop crossorigin="anonymous"> </audio></a></div></div></article><aside><div id="about"><a href="/" id="logo"><img src="https://ak.hypergryph.com/assets/index/images/ak/pc/faction/1.png" alt="Hexo" style="margin:0;border-radius:0;"></a><h1 id="Dr"><a href="/">John Doe</a></h1><div id="description"><p></p></div></div><div id="aside-block"></div><footer><nobr>Published with <a target="_blank" rel="noopener" href="http://hexo.io">Hexo</a></nobr><wbr><nobr> Theme <a target="_blank" rel="noopener" href="https://github.com/Yue-plus/hexo-theme-arknights">Arknights</a></nobr><wbr><nobr> by <a target="_blank" rel="noopener" href="https://github.com/Yue-plus">Yue_plus</a></nobr></footer></aside></main><canvas id="canvas-dust"></canvas></body></html>
