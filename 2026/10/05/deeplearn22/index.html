e">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br></pre></td><td class="code"><pre><code class="hljs python"><span class="hljs-string">&quot;&quot;&quot;</span><br><span class="hljs-string">案例:</span><br><span class="hljs-string">    演示卷积层的API, 用于 提取图像的局部特征, 获取: 特征图(Feature Map)</span><br><span class="hljs-string"></span><br><span class="hljs-string">卷积神经网络介绍:</span><br><span class="hljs-string">    概述:</span><br><span class="hljs-string">        全称叫: Convolutional neural network, 即: 包含卷积层的神经网络.</span><br><span class="hljs-string">    组成:</span><br><span class="hljs-string">        卷积层(Convolutional):</span><br><span class="hljs-string">            用于提取图像的 局部特征, 结合 卷积核(每个卷积核 = 1个神经元) 实现, 处理后的结果叫: 特征图.</span><br><span class="hljs-string">        池化层(Pooling):</span><br><span class="hljs-string">            用于 降维, 降采样</span><br><span class="hljs-string">        全连接层(Full Connected, fc, linear):</span><br><span class="hljs-string">            用于 预测结果, 并输出结果的.</span><br><span class="hljs-string">    特征图计算方式:</span><br><span class="hljs-string">        N = (W - F + 2*P) / S   +  1</span><br><span class="hljs-string">        W: 输入图像的大小</span><br><span class="hljs-string">        F: 卷积核的大小</span><br><span class="hljs-string">        P: 填充的大小</span><br><span class="hljs-string">        S: 步长</span><br><span class="hljs-string">        N: 输出图像的大小(特征图大小)</span><br><span class="hljs-string">&quot;&quot;&quot;</span><br><br><span class="hljs-comment"># 导包</span><br><span class="hljs-keyword">import</span> torch<br><span class="hljs-keyword">import</span> torch.nn <span class="hljs-keyword">as</span> nn<br><span class="hljs-keyword">import</span> matplotlib.pyplot <span class="hljs-keyword">as</span> plt<br><br><span class="hljs-comment"># 1. 定义函数, 用于完成图像的加载, 卷积, 特征图可视化操作.</span><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">dm01</span>():<br>    <span class="hljs-comment"># 1. 加载RGB真彩图.</span><br>    img = plt.imread(<span class="hljs-string">&#x27;./data/deepseek.jpg&#x27;</span>)<br>    <span class="hljs-comment"># 2. 打印读取到的图像信息.</span><br>    <span class="hljs-comment"># print(f&#x27;img: &#123;img&#125;, shape: &#123;img.shape&#125;&#x27;)     # HWC (640, 640, 3)</span><br><br>    <span class="hljs-comment"># 3. 把图像的形状从 HWC -&gt; CHW, 思路: img -&gt; 张量 -&gt; 转换维度.</span><br>    img2 = torch.tensor(img, dtype=torch.<span class="hljs-built_in">float</span>)<br>    img2 = img2.permute(<span class="hljs-number">2</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>)<br>    <span class="hljs-comment"># print(f&#x27;img2: &#123;img2&#125;, shape: &#123;img2.shape&#125;&#x27;)    # [3, 640, 640]</span><br><br>    <span class="hljs-comment"># 4. 因为这里只有1张图, 所以我们给它在增加1个维度, 从 CHW -&gt; (1, C, H, W), 1张3通道的 640*640像素的 图</span><br>    img3 = img2.unsqueeze(dim=<span class="hljs-number">0</span>)<br>    <span class="hljs-comment"># print(f&#x27;img3: &#123;img3&#125;, shape: &#123;img3.shape&#125;&#x27;)      # [1, 3, 640, 640]</span><br><br>    <span class="hljs-comment"># 5. 创建卷积层对象, 提取 特征图.</span><br>    <span class="hljs-comment"># 参1: 输入图像的通道数, 参2: 输出图像的通道数(几个特征图), 参3: 卷积核的大小, 参4: 步长, 参5: 填充.</span><br>    conv = nn.Conv2d(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">3</span>, <span class="hljs-number">2</span>, <span class="hljs-number">0</span>)<br><br>    <span class="hljs-comment"># 6. 具体的卷积计算.</span><br>    conv_img = conv(img3)<br><br>    <span class="hljs-comment"># 7. 打印卷积后的结果.   1张4通道的 319*319像素的 图</span><br>    <span class="hljs-comment"># print(f&#x27;conv_img: &#123;conv_img&#125;, shape: &#123;conv_img.shape&#125;&#x27;) # (1, 4, 319, 319)</span><br><br>    <span class="hljs-comment"># 8. 查看提取到的 4个 特征图.</span><br>    img4 = conv_img[<span class="hljs-number">0</span>]<br>    <span class="hljs-comment"># print(f&#x27;img4: &#123;img4&#125;, shape: &#123;img4.shape&#125;&#x27;)     # (4, 319, 319) -&gt; CHW</span><br><br>    <span class="hljs-comment"># 9. 把上述的图从 CHW -&gt; HWC</span><br>    img5 = img4.permute(<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">0</span>)<br>    <span class="hljs-comment"># print(f&#x27;img5: &#123;img5&#125;, shape: &#123;img5.shape&#125;&#x27;)       # (319, 319, 4) -&gt; HWC</span><br><br>    <span class="hljs-comment"># 10. 可视化第1个通道的特征图.</span><br>    feature1 = img5[:, :, <span class="hljs-number">3</span>].detach().numpy()           <span class="hljs-comment"># 第0通道(即: 第1通道的)  (319, 319)像素图</span><br>    plt.imshow(feature1)<br>    plt.show()<br><br><br><span class="hljs-comment"># 2. 测试</span><br><span class="hljs-keyword">if</span> __name__ == <span class="hljs-string">&#x27;__main__&#x27;</span>:<br>    dm01()<br></code></pre></td></tr></table></figure>
